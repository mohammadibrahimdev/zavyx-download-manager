[package]
name = "zavyx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI control surface for Zavyx"

[[bin]]
name = "zavyx-cli"
path = "src/main.rs"

[[bin]]
name = "zavyx-host"
path = "src/bin/native_messaging_host.rs"

[dependencies]
zavyx-core = { path = "../zavyx-core" }
zavyx-native-messaging = { path = "../zavyx-native-messaging" }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
